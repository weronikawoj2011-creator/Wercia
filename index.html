<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08030a">
<title>Wercia & Grzesiu ♡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pink:#ff75b9;--hot:#ff2994;--pale:#ffd5e9}
body{
 min-height:100vh; overflow:hidden; color:#fff; background:
 radial-gradient(ellipse at 50% 48%,#26091b 0%,#100610 42%,#050307 100%);
 font-family: "Segoe UI",Arial,sans-serif; display:grid; place-items:center;
}
.page{position:relative;z-index:2;width:100%;padding:24px 14px;text-align:center}
.names{font-size:clamp(29px,6vw,45px);font-weight:750;letter-spacing:1px;
 color:#ffd3e8;text-shadow:0 0 12px #ff2994,0 0 30px #ff299477}
.names span{color:var(--pink);padding:0 5px}
.tagline{margin:9px 0 22px;color:#f8b6d7;font-size:14px;letter-spacing:2px}
.heart-frame{position:relative;width:min(390px,91vw);aspect-ratio:1.08;margin:auto;
 filter:drop-shadow(0 0 13px #ff2994aa) drop-shadow(0 0 34px #ff299455)}
.heart-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.heart-photo{width:100%;height:100%;object-fit:cover;object-position:50% 43%}
.counter-panel{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);
 width:72%;padding:15px 12px 13px;border:1px solid #ffadd4aa;border-radius:18px;
 background:rgba(12,3,10,.76);backdrop-filter:blur(5px);
 box-shadow:0 0 22px #ff299455,inset 0 0 18px #ff75b922}
.counter-title{font-size:clamp(15px,3.8vw,19px);color:#fff1f8;margin-bottom:11px;
 text-shadow:0 0 10px #ff2994}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.unit{padding:7px 3px;border-radius:10px;background:#3b102bba;border:1px solid #ff75b966}
.num{display:block;font-size:clamp(20px,5vw,27px);font-weight:800;color:#ffabd2;
 text-shadow:0 0 12px #ff2994;font-variant-numeric:tabular-nums}
.label{display:block;margin-top:2px;font-size:9px;letter-spacing:1px;color:#ffe0ef}
.unit.seconds{grid-column:span 2}
.footer{margin-top:22px;color:#ffc4df;font-size:15px;text-shadow:0 0 12px #ff2994}
.footer .tiny{display:block;margin-top:7px;font-size:12px;color:#dca5c1;letter-spacing:1px}
.float{position:fixed;bottom:-50px;z-index:1;pointer-events:none;color:#ff79bb;
 text-shadow:0 0 10px #ff2994,0 0 22px #ff2994;animation:rise linear forwards}
@keyframes rise{0%{transform:translateY(0) rotate(0) scale(.7);opacity:0}
 15%{opacity:.85}85%{opacity:.75}100%{transform:translateY(-115vh) rotate(330deg) scale(1.25);opacity:0}}
.sparkle{position:fixed;width:4px;height:4px;border-radius:50%;background:#ffd8eb;
 box-shadow:0 0 7px 2px #ff75b9;z-index:1;pointer-events:none;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.5)}}
@media(max-width:380px){.counter-panel{width:74%;padding:11px 9px}.grid{gap:6px}.unit{padding:6px 2px}}

/* Układ: zdjęcie wyżej, licznik niżej w jednym rzędzie */
.heart-frame{
 width:min(350px,84vw);
 aspect-ratio:1.08;
 margin:0 auto 18px;
}
.counter-panel{
 position:relative;
 left:auto; top:auto; transform:none;
 width:min(760px,96vw);
 margin:0 auto;
 padding:12px 14px;
}
.counter-title{margin-bottom:10px}
.grid{
 grid-template-columns:repeat(5,minmax(0,1fr));
 gap:7px;
}
.unit.seconds{grid-column:auto}
.unit{padding:8px 3px}
.num{font-size:clamp(16px,3.5vw,25px)}
.label{font-size:clamp(7px,1.5vw,10px);letter-spacing:.5px}
.footer{margin-top:15px}
@media(max-width:480px){
 .heart-frame{width:min(310px,78vw);margin-bottom:12px}
 .counter-panel{padding:9px 7px}
 .grid{gap:4px}
 .unit{padding:7px 1px}
 .num{font-size:clamp(14px,4vw,19px)}
 .label{font-size:7px;letter-spacing:0}
}

</style>
</head>

 <section class="counter-panel">
   <div class="counter-title">Jesteśmy razem już…</div>
   <div class="grid">
    <div class="unit"><span class="num" id="months">0</span><span class="label">MIESIĘCY</span></div>
    <div class="unit"><span class="num" id="days">0</span><span class="label">DNI</span></div>
    <div class="unit"><span class="num" id="hours">00</span><span class="label">GODZIN</span></div>
    <div class="unit"><span class="num" id="minutes">00</span><span class="label">MINUT</span></div>
    <div class="unit seconds"><span class="num" id="seconds">00</span><span class="label">SEKUND</span></div>
   </div>
  </section>

 <div class="footer">Każda sekunda z Tobą jest wyjątkowa ♡
  <span class="tiny">OD 6 WRZEŚNIA 2026</span>
 </div>
</main>
<script>
const startDate = new Date(2026, 8, 6, 0, 0, 0);
const $ = id => document.getElementById(id);
function updateCounter(){
 const now = new Date();
 if(now < startDate){
  ["months","days","hours","minutes","seconds"].forEach((id,i)=>$(id).textContent=i===0?"0":"00");
  return;
 }
 let months=(now.getFullYear()-startDate.getFullYear())*12+(now.getMonth()-startDate.getMonth());
 let anniversary=new Date(startDate.getFullYear(),startDate.getMonth()+months,startDate.getDate());
 if(anniversary>now){months--;anniversary=new Date(startDate.getFullYear(),startDate.getMonth()+months,startDate.getDate());}
 const ms=now-anniversary;
 $("months").textContent=months;
 $("days").textContent=Math.floor(ms/86400000);
 $("hours").textContent=String(Math.floor(ms/3600000)%24).padStart(2,"0");
 $("minutes").textContent=String(Math.floor(ms/60000)%60).padStart(2,"0");
 $("seconds").textContent=String(Math.floor(ms/1000)%60).padStart(2,"0");
}
updateCounter();setInterval(updateCounter,1000);

function addHeart(){
 const el=document.createElement("div");el.className="float";
 el.textContent=Math.random()>.5?"♥":"♡";
 el.style.left=Math.random()*100+"vw";
 el.style.fontSize=(13+Math.random()*27)+"px";
 const duration=7+Math.random()*7;el.style.animationDuration=duration+"s";
 document.body.appendChild(el);setTimeout(()=>el.remove(),duration*1000);
}
setInterval(addHeart,520);
for(let i=0;i<22;i++){
 const s=document.createElement("i");s.className="sparkle";
 s.style.left=Math.random()*100+"vw";s.style.top=Math.random()*100+"vh";
 s.style.animationDelay=(Math.random()*2.4)+"s";document.body.appendChild(s);
}
</script>
